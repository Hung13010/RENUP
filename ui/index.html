<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>RENUP</title>
<style>
:root {
  --bg: #ffffff;
  --surface: #f5f5f5;
  --surface2: #efefef;
  --border: #d0d0d0;
  --header-bg: #1B2A4A;
  --accent: #2E7D6A;
  --accent2: #3a9d84;
  --accent-light: #E8F5E9;
  --text: #111111;
  --text-muted: #555555;
  --text-dim: #999999;
  --danger: #E74C3C;
  --log-bg: #1C2333;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  user-select: none;
  display: flex;
  flex-direction: column;
}

/* ── HEADER ── */
.header {
  position: relative;
  padding: 12px 16px;
  background: var(--header-bg);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 10px;
}
.header::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
}
.logo-mark {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.header-title { font-size: 15px; font-weight: 700; color: #fff; letter-spacing: 0.06em; }
.header-sub { font-size: 10px; color: #8CA0B3; }
.status-dot { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 10px; color: #8CA0B3; font-family: monospace; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); transition: all 0.3s; }
.dot.running { background: var(--accent); box-shadow: 0 0 6px var(--accent); animation: pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* ── LAYOUT ── */
.app-layout { display: flex; flex: 1; overflow: hidden; }

.panel-left {
  width: 400px; flex-shrink: 0;
  display: flex; flex-direction: column;
  border-right: 1px solid var(--border);
  overflow: hidden;
}
.panel-left-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 12px 14px 8px; display: flex; flex-direction: column; gap: 10px; }
.panel-left-footer { flex-shrink: 0; padding: 8px 14px 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }

.panel-right {
  flex: 1; display: flex; flex-direction: column;
  overflow: hidden; min-width: 0;
}

/* ── FORM ── */
.field-label {
  display: flex; align-items: center; gap: 5px;
  font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px;
}
.badge {
  margin-left: auto; font-size: 9px; font-family: monospace;
  color: var(--text-dim); background: var(--surface2);
  padding: 1px 5px; border-radius: 3px; border: 1px solid var(--border);
}

textarea, input[type="text"], select {
  width: 100%; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 7px; color: var(--text); font-family: 'Consolas', monospace;
  font-size: 11px; line-height: 1.5; outline: none;
  transition: border-color 0.2s, box-shadow 0.2s; resize: none;
}
textarea:focus, input[type="text"]:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(46,125,106,0.15); }
textarea { padding: 8px 10px; }
input[type="text"] { padding: 7px 10px; height: 34px; }
select { padding: 7px 10px; height: 34px; cursor: pointer; font-family: 'Segoe UI', Arial; font-size: 11px; }
select optgroup { font-weight: 700; color: var(--header-bg); font-style: normal; padding: 4px 0; }
select option { font-weight: 400; color: var(--text); padding: 4px 8px; }

.input-row { display: flex; gap: 4px; align-items: center; }
.input-row input[type="text"] { flex: 1; }
.browse-btn {
  height: 34px; width: 34px; flex-shrink: 0;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 7px; cursor: pointer; display: flex; align-items: center;
  justify-content: center; font-size: 14px; transition: all 0.15s; color: var(--text-muted);
}
.browse-btn:hover { background: #e0e0e0; border-color: #aaa; }

.settings-row { display: flex; gap: 8px; align-items: center; }
.settings-row input[type="text"] { width: 60px; text-align: center; }

/* ── GHEP SECTION ── */
#ghepSection { display: flex; flex-direction: column; gap: 8px; flex: 1; }
#ghepSection textarea { flex: 1; min-height: 100px; }
.editor-btns { display: flex; gap: 4px; }

/* ── SPLIT SECTION ── */
#splitSection { display: none; }

/* ── BUTTONS ── */
button {
  height: 36px; border: none; border-radius: 7px;
  font-family: 'Segoe UI', Arial; font-size: 11px; font-weight: 700;
  letter-spacing: 0.05em; text-transform: uppercase;
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-sm { height: 30px; padding: 0 12px; font-size: 10px; }
.btn-accent { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; box-shadow: 0 3px 10px rgba(46,125,106,0.25); }
.btn-accent:hover { transform: translateY(-1px); box-shadow: 0 5px 15px rgba(46,125,106,0.35); }
.btn-accent:disabled { background: #ccc; color: #888; box-shadow: none; cursor: not-allowed; transform: none; }
.btn-muted { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
.btn-muted:hover { background: #e0e0e0; }
.btn-danger { background: #fee2e2; color: var(--danger); border: 1px solid rgba(231,76,60,0.3); }
.btn-danger:hover { background: #fecaca; }

#runBtn { height: 40px; font-size: 12px; }

/* ── STATUS BAR ── */
.status-bar-bottom {
  padding: 6px 14px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
  font-size: 10px; color: var(--text-muted); flex-shrink: 0;
}
.progress-wrap { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.progress-bar { width: 200px; height: 10px; background: var(--surface2); border-radius: 5px; overflow: hidden; border: 1px solid var(--border); }
.progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.3s; }

/* ── TABLE ── */
.table-toolbar {
  padding: 8px 14px; background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; flex-shrink: 0;
}
.toolbar-title { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-muted); }
.toolbar-count { font-size: 9px; font-family: monospace; color: var(--text-dim); background: var(--surface2); padding: 2px 7px; border-radius: 3px; border: 1px solid var(--border); }
.toolbar-spacer { flex: 1; }

.table-wrap { flex: 1; overflow: auto; }
.data-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 11px; }
.data-table th {
  position: sticky; top: 0; z-index: 10;
  background: var(--surface); border-bottom: 2px solid var(--border);
  padding: 7px 10px; text-align: left;
  font-size: 9px; font-weight: 700; letter-spacing: 0.07em;
  text-transform: uppercase; color: var(--text-muted);
  white-space: nowrap;
}
.data-table td {
  padding: 6px 10px; border-bottom: 1px solid var(--surface2);
  vertical-align: middle; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
.data-table tr:hover td { background: #fafafa; }
.col-num { width: 40px; text-align: center; }
.col-name { }
.col-size { width: 100px; }
.col-ext { width: 80px; text-align: center; }

/* ── ADD BUTTON ── */
#addToListBtn {
  margin: 0; flex-shrink: 0;
  background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
  box-shadow: 0 3px 10px rgba(46,125,106,0.25);
  border-radius: 0; height: 36px;
}
#addToListBtn:hover { box-shadow: 0 5px 15px rgba(46,125,106,0.35); }

/* ── LOG ── */
.log-header {
  padding: 8px 14px; background: var(--surface);
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  font-size: 11px; font-weight: 700; letter-spacing: 0.07em;
  text-transform: uppercase; color: var(--text-muted); flex-shrink: 0;
}
.log-wrap {
  flex: 1; overflow-y: auto; background: var(--log-bg);
  padding: 10px 14px; font-family: 'Consolas', monospace; font-size: 11px;
  line-height: 1.6; color: #d4d4d4;
}
.log-ok { color: #66BB6A; }
.log-err { color: #E74C3C; }
.log-info { color: #8CA0B3; }

/* ── TABLE SECTION toggle ── */
#tableSection { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
#tableSection.hidden { display: none; }
#ghepSection.hidden { display: none; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo-mark">R</div>
  <div>
    <div class="header-title">RENUP</div>
    <div class="header-sub">video processing tool · <span id="versionText">v1.1.0</span></div>
  </div>
  <div class="status-dot">
    <div class="dot" id="statusDot"></div>
    <span id="statusLabel">stopped</span>
  </div>
</div>

<!-- MAIN -->
<div class="app-layout">
  <!-- LEFT -->
  <div class="panel-left">
    <!-- TOP: Editor (flex, co giãn) -->
    <div class="panel-left-scroll">
      <div id="ghepSection">
        <div class="field-label">≡ Nội dung ghép <span class="badge" id="lineCount">0 dòng</span></div>
        <textarea id="editor" placeholder="Thêm video vào đây, phân nhóm bằng #" spellcheck="false"></textarea>
        <div class="editor-btns">
          <button class="btn-sm btn-muted" onclick="pyApi.addSeparator()">Thêm #</button>
          <button class="btn-sm btn-muted" onclick="pyApi.saveNoiTxt()">Lưu Noi.txt</button>
          <button class="btn-sm btn-danger" onclick="pyApi.clearEditor()">Xóa</button>
        </div>
      </div>

      <div id="splitSection">
        <div class="field-label">✂ Thời lượng mỗi phần</div>
        <div class="settings-row">
          <input type="text" id="splitSeconds" value="300" style="width:80px;">
          <span style="font-size:11px; color:var(--text-muted);">giây / phần</span>
        </div>
      </div>
    </div>

    <!-- BOTTOM: Controls (cố định) -->
    <div class="panel-left-footer">
      <div class="field-label">⚙ Chọn chức năng</div>
      <select id="funcSelect" onchange="onFuncChanged()"></select>

      <div class="field-label">📁 Folder Input</div>
      <div class="input-row">
        <input type="text" id="inputDir" placeholder="Chọn thư mục chứa video...">
        <button class="browse-btn" onclick="pyApi.browseInput()">📂</button>
      </div>

      <div class="field-label">📁 Folder Output</div>
      <div class="input-row">
        <input type="text" id="outputDir" placeholder="Chọn thư mục lưu kết quả...">
        <button class="browse-btn" onclick="pyApi.browseOutput()">📂</button>
      </div>

      <div class="settings-row">
        <span class="field-label" style="margin:0;">Luồng</span>
        <input type="text" id="workers" value="2" style="width:50px;">
        <div style="flex:1;"></div>
        <button id="runBtn" class="btn-accent" style="width:140px;" onclick="pyApi.run()">▶ RUN</button>
      </div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="panel-right">
    <!-- TABLE -->
    <div id="tableSection">
      <div class="table-toolbar">
        <span class="toolbar-title">Danh sách video</span>
        <span class="toolbar-count" id="fileCount">0 file</span>
        <div class="toolbar-spacer"></div>
        <button class="btn-sm btn-muted" onclick="pyApi.refreshVideos()">Refresh</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th class="col-num">#</th>
              <th class="col-name">Tên file</th>
              <th class="col-size">Kích thước</th>
              <th class="col-ext">Định dạng</th>
            </tr>
          </thead>
          <tbody id="videoTableBody"></tbody>
        </table>
      </div>
      <button id="addToListBtn" onclick="pyApi.addSelectedToEditor()">+ Thêm vào danh sách ghép</button>
    </div>

    <!-- LOG -->
    <div class="log-header">Log</div>
    <div class="log-wrap" id="logArea"></div>
  </div>
</div>

<!-- STATUS BAR -->
<div class="status-bar-bottom">
  <span id="statusText">Sẵn sàng.</span>
  <div class="progress-wrap">
    <span id="progressLabel"></span>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>
</div>

<script>
// ── Globals ──
let selectedRows = new Set();

function onFuncChanged() {
  const sel = document.getElementById('funcSelect');
  const val = sel.value;
  pyApi.onFuncChanged(val);
}

// ── Called from Python ──
window.uiApi = {
  setVersion(v) { document.getElementById('versionText').textContent = 'v' + v; },

  setCodes(groups) {
    const sel = document.getElementById('funcSelect');
    sel.innerHTML = '';
    groups.forEach(g => {
      if (g.category) {
        const og = document.createElement('optgroup');
        og.label = g.category;
        g.items.forEach(n => { const o = document.createElement('option'); o.value = n; o.textContent = n; og.appendChild(o); });
        sel.appendChild(og);
      } else {
        g.items.forEach(n => { const o = document.createElement('option'); o.value = n; o.textContent = n; sel.appendChild(o); });
      }
    });
  },

  setEditor(text) { document.getElementById('editor').value = text; updateLineCount(); },

  showGhepSection(show) {
    document.getElementById('ghepSection').classList.toggle('hidden', !show);
    document.getElementById('tableSection').classList.toggle('hidden', !show);
  },

  showSplitSection(show) {
    document.getElementById('splitSection').style.display = show ? 'block' : 'none';
  },

  setVideos(videos) {
    const tbody = document.getElementById('videoTableBody');
    tbody.innerHTML = '';
    selectedRows.clear();
    videos.forEach((v, i) => {
      const tr = document.createElement('tr');
      tr.dataset.name = v.name;
      tr.onclick = (e) => toggleRow(tr, v.name, e);
      tr.innerHTML = '<td class="col-num">' + (i+1) + '</td><td class="col-name">' + v.name + '</td><td class="col-size">' + v.size + '</td><td class="col-ext">' + v.ext + '</td>';
      tbody.appendChild(tr);
    });
    document.getElementById('fileCount').textContent = videos.length + ' file';
  },

  log(msg, tag) {
    const area = document.getElementById('logArea');
    const cls = tag === 'ok' ? 'log-ok' : tag === 'err' ? 'log-err' : tag === 'info' ? 'log-info' : '';
    area.innerHTML += '<div class="' + cls + '">' + escHtml(msg) + '</div>';
    area.scrollTop = area.scrollHeight;
  },

  setStatus(text) { document.getElementById('statusText').textContent = text; },
  setProgress(pct, label) {
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressLabel').textContent = label;
  },
  setRunning(running) {
    document.getElementById('statusDot').classList.toggle('running', running);
    document.getElementById('statusLabel').textContent = running ? 'running' : 'stopped';
    document.getElementById('runBtn').disabled = running;
  },
  setInputDir(path) { document.getElementById('inputDir').value = path; },
  setOutputDir(path) { document.getElementById('outputDir').value = path; },
};

function toggleRow(tr, name, e) {
  if (e.ctrlKey) {
    if (selectedRows.has(name)) { selectedRows.delete(name); tr.style.background = ''; }
    else { selectedRows.add(name); tr.style.background = 'var(--accent-light)'; }
  } else {
    document.querySelectorAll('#videoTableBody tr').forEach(r => { r.style.background = ''; });
    selectedRows.clear();
    selectedRows.add(name);
    tr.style.background = 'var(--accent-light)';
  }
}

function updateLineCount() {
  const text = document.getElementById('editor').value;
  const lines = text.split('\n').filter(l => l.trim()).length;
  document.getElementById('lineCount').textContent = lines + ' dòng';
}
document.getElementById('editor')?.addEventListener('input', updateLineCount);

function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ── pyApi proxy (pywebview exposes this) ──
const pyApi = new Proxy({}, {
  get(_, method) {
    return (...args) => {
      if (method === 'addSelectedToEditor') args = [Array.from(selectedRows)];
      if (method === 'run') {
        args = [{
          func: document.getElementById('funcSelect').value,
          inputDir: document.getElementById('inputDir').value,
          outputDir: document.getElementById('outputDir').value,
          workers: parseInt(document.getElementById('workers').value) || 2,
          splitSeconds: parseInt(document.getElementById('splitSeconds').value) || 300,
          editorText: document.getElementById('editor').value,
        }];
      }
      if (method === 'saveNoiTxt') args = [document.getElementById('editor').value];
      if (window.pywebview && window.pywebview.api && window.pywebview.api[method]) {
        return window.pywebview.api[method](...args);
      }
    };
  }
});
</script>
</body>
</html>
